name: HACS Validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    name: Validate with HACS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Brand images come from a separate brands repository, not this one
          ignore: "brands"
